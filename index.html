<!-- Timeless Inspiration - 水调歌头 -->
<section class="poetry" style="padding: 100px 0; background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);">
    <div class="container">
        <div class="section-title">
            <h2>水调歌头</h2>
            <p style="font-size: 18px; color: #555;">苏轼 · 丙辰中秋</p>
        </div>
        
        <div style="max-width: 800px; margin: 0 auto; background: white; padding: 60px 50px; border-radius: 16px; box-shadow: 0 10px 40px rgba(67, 97, 238, 0.1);">
            <div style="font-family: 'Poppins', serif; font-size: 21px; line-height: 2.1; color: #333; text-align: center;">
                明月几时有？把酒问青天。<br>
                不知天上宫阙，今夕是何年。<br>
                我欲乘风归去，又恐琼楼玉宇，高处不胜寒。<br>
                起舞弄清影，何似在人间。<br><br>
                
                转朱阁，低绮户，照无眠。<br>
                不应有恨，何事长向别时圆？<br>
                人有悲欢离合，月有阴晴圆缺，此事古难全。<br>
                但愿人长久，千里共婵娟。
            </div>
            
            <div style="text-align: center; margin-top: 40px;">
                <span style="display: inline-block; padding: 8px 25px; background: #eef2ff; color: #4361ee; border-radius: 30px; font-size: 15px;">
                    —— 苏轼
                </span>
            </div>
        </div>
    </div>
</section>
